<!-- sidebar.html -->
<aside id="mobile-menu"

  <button onclick="toggleMenu()"

          <span data-lang="nl">Over mij</span><span data-lang="en">About</span>
        </a>
        <a href="#" data-route="projects" class="nav-link px-3 py-2.5 rounded-lg hover:bg-white/5 hover:text-[#60a5fa] transition-colors text-[#e6eef8]">

        <a href="#" data-route="contact" class="nav-link px-3 py-2.5 rounded-lg hover:bg-white/5 hover:text-[#60a5fa] transition-colors text-[#e6eef8]">

        <span data-lang="nl">Links</span><span data-lang="en">Links</span>

        <a href="https://github.com/LeroyExel" target="_blank" rel="noopener noreferrer"
